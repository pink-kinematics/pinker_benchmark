name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: lint
          cache: true
      - run: pixi run -e lint dev-lint

  test:
    name: "Test on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: test
          cache: true
      - name: Cache robot descriptions
        uses: actions/cache@v4
        with:
          path: ~/.cache/robot_descriptions
          key: robot-descriptions-${{ hashFiles('pixi.lock') }}
          restore-keys: robot-descriptions-
      - run: pixi run -e test dev-test

  ci_success:
    name: "CI success"
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: echo "CI workflow completed successfully"
